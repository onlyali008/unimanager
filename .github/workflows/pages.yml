name: Deploy to GitHub Pages

# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then every push to this branch publishes the static app to
# https://<user>.github.io/<repo>/.

on:
  push:
    branches: [local-first-planner]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build static site
        run: npm run build
        env:
          # Repo name, so assets resolve under the project sub-path.
          NEXT_PUBLIC_BASE_PATH: /unimanager
          # Absolute base for social/OG preview URLs.
          NEXT_PUBLIC_SITE_URL: https://onlyali008.github.io/unimanager
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
