<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semestra</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f6f7f9;
        color: #262b38;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #14161f;
          color: #e6e8ee;
        }
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 12px;
        padding: 32px 24px;
        box-sizing: border-box;
        max-width: 420px;
        margin: 0 auto;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 28px;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 14px;
        opacity: 0.75;
        line-height: 1.5;
      }
      input {
        font: inherit;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #c6cad4;
        background: transparent;
        color: inherit;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #4c46af;
        color: white;
      }
      #error {
        color: #b3261e;
        font-size: 13px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Semestra</h1>
      <p>
        Enter the address of the computer running Semestra — e.g.
        <code>http://192.168.1.20:3000</code> on your home network, or your
        machine's Tailscale address when away.
      </p>
      <input
        id="server"
        type="url"
        inputmode="url"
        autocapitalize="off"
        placeholder="http://192.168.1.20:3000"
      />
      <button id="connect">Connect</button>
      <p id="error"></p>
    </main>
    <script>
      const input = document.getElementById("server");
      const error = document.getElementById("error");
      const saved = localStorage.getItem("semestra-server-url");
      if (saved) input.value = saved;

      async function connect() {
        error.textContent = "";
        let url = input.value.trim().replace(/\/+$/, "");
        if (!url) return;
        if (!/^https?:\/\//.test(url)) url = "http://" + url;
        try {
          // no-cors: the Semestra server sends no CORS headers, so a normal
          // fetch would be blocked even when the server is reachable. An
          // opaque response resolving at all means the host answered.
          await fetch(url + "/", {
            method: "HEAD",
            mode: "no-cors",
            signal: AbortSignal.timeout(5000),
          });
          localStorage.setItem("semestra-server-url", url);
          location.href = url;
        } catch {
          error.textContent =
            "Couldn't reach that address. Is the app running on your computer, and are both devices on the same network (or Tailscale)?";
        }
      }

      document.getElementById("connect").addEventListener("click", connect);
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") connect();
      });

      // Auto-connect if we've connected successfully before.
      if (saved) connect();
    </script>
  </body>
</html>
